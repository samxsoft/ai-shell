<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="btc-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7931a" />
      <stop offset="100%" stop-color="#e67e00" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />
  <!-- Header -->
  <rect x="0" y="0" width="300" height="50" fill="url(#btc-grad)" rx="16" />
  <rect x="0" y="30" width="300" height="20" fill="url(#btc-grad)" />
  <text x="150" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Bitcoin (BTC) 捐赠</text>
  
  <!-- QR Box -->
  <rect x="25" y="65" width="250" height="250" fill="#fffdfa" rx="12" stroke="#fae3c6" stroke-width="2"/>
  
  <!-- Simulated QR Pattern -->
  <g fill="#f7931a">
    <!-- Corner Boxes -->
    <rect x="45" y="85" width="50" height="50" rx="6" fill="#f7931a"/>
    <rect x="53" y="93" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="61" y="101" width="18" height="18" rx="2" fill="#f7931a"/>
    
    <rect x="205" y="85" width="50" height="50" rx="6" fill="#f7931a"/>
    <rect x="213" y="93" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="221" y="101" width="18" height="18" rx="2" fill="#f7931a"/>
    
    <rect x="45" y="245" width="50" height="50" rx="6" fill="#f7931a"/>
    <rect x="53" y="253" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="61" y="261" width="18" height="18" rx="2" fill="#f7931a"/>
    
    <!-- Center BTC Icon Symbol -->
    <circle cx="150" cy="190" r="22" fill="#f7931a" />
    <text x="150" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">₿</text>
    
    <!-- Decorative Matrix Elements -->
    <rect x="110" y="85" width="12" height="24" rx="2"/>
    <rect x="130" y="85" width="25" height="12" rx="2"/>
    <rect x="165" y="85" width="15" height="24" rx="2"/>
    <rect x="110" y="120" width="30" height="12" rx="2"/>
    <rect x="155" y="120" width="25" height="20" rx="2"/>
    
    <rect x="45" y="155" width="30" height="12" rx="2"/>
    <rect x="85" y="155" width="12" height="35" rx="2"/>
    <rect x="45" y="180" width="25" height="25" rx="2"/>
    <rect x="45" y="215" width="40" height="12" rx="2"/>
    
    <rect x="195" y="155" width="20" height="15" rx="2"/>
    <rect x="225" y="155" width="30" height="12" rx="2"/>
    <rect x="200" y="180" width="20" height="40" rx="2"/>
    <rect x="230" y="180" width="25" height="25" rx="2"/>
    
    <rect x="105" y="225" width="25" height="15" rx="2"/>
    <rect x="140" y="225" width="20" height="30" rx="2"/>
    <rect x="170" y="225" width="30" height="15" rx="2"/>
    <rect x="105" y="250" width="15" height="45" rx="2"/>
    <rect x="130" y="265" width="30" height="15" rx="2"/>
    <rect x="170" y="250" width="25" height="45" rx="2"/>
    
    <rect x="210" y="235" width="45" height="15" rx="2"/>
    <rect x="210" y="260" width="20" height="35" rx="2"/>
    <rect x="240" y="260" width="15" height="35" rx="2"/>
  </g>
  
  <!-- Footer Note -->
  <text x="150" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">请替换为您的真实 BTC 收款码</text>
</svg>
