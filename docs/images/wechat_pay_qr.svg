<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 360" width="300" height="360">
  <defs>
    <linearGradient id="wechat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07c160" />
      <stop offset="100%" stop-color="#059649" />
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff" rx="16" />
  <!-- Header -->
  <rect x="0" y="0" width="300" height="50" fill="url(#wechat-grad)" rx="16" />
  <rect x="0" y="30" width="300" height="20" fill="url(#wechat-grad)" />
  <text x="150" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">微信赞赏 / WeChat Pay</text>
  
  <!-- QR Box -->
  <rect x="25" y="65" width="250" height="250" fill="#f8f9fa" rx="12" stroke="#e9ecef" stroke-width="2"/>
  
  <!-- Simulated QR Pattern -->
  <g fill="#07c160">
    <!-- Corner Boxes -->
    <rect x="45" y="85" width="50" height="50" rx="6" fill="#07c160"/>
    <rect x="53" y="93" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="61" y="101" width="18" height="18" rx="2" fill="#07c160"/>
    
    <rect x="205" y="85" width="50" height="50" rx="6" fill="#07c160"/>
    <rect x="213" y="93" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="221" y="101" width="18" height="18" rx="2" fill="#07c160"/>
    
    <rect x="45" y="245" width="50" height="50" rx="6" fill="#07c160"/>
    <rect x="53" y="253" width="34" height="34" rx="3" fill="#ffffff"/>
    <rect x="61" y="261" width="18" height="18" rx="2" fill="#07c160"/>
    
    <!-- Decorative Matrix Elements -->
    <rect x="110" y="85" width="12" height="12" rx="2"/>
    <rect x="130" y="85" width="12" height="24" rx="2"/>
    <rect x="155" y="85" width="24" height="12" rx="2"/>
    <rect x="110" y="115" width="35" height="12" rx="2"/>
    <rect x="160" y="115" width="20" height="20" rx="2"/>
    
    <rect x="45" y="155" width="20" height="12" rx="2"/>
    <rect x="75" y="155" width="12" height="35" rx="2"/>
    <rect x="105" y="145" width="40" height="40" rx="6" fill="#07c160"/>
    <circle cx="125" cy="165" r="10" fill="#ffffff"/>
    
    <rect x="160" y="155" width="30" height="12" rx="2"/>
    <rect x="210" y="155" width="45" height="12" rx="2"/>
    <rect x="160" y="180" width="15" height="40" rx="2"/>
    <rect x="190" y="180" width="30" height="15" rx="2"/>
    <rect x="235" y="180" width="20" height="30" rx="2"/>
    
    <rect x="110" y="205" width="35" height="12" rx="2"/>
    <rect x="110" y="230" width="20" height="30" rx="2"/>
    <rect x="145" y="230" width="35" height="15" rx="2"/>
    <rect x="145" y="260" width="20" height="35" rx="2"/>
    
    <rect x="180" y="230" width="40" height="40" rx="4"/>
    <rect x="235" y="230" width="20" height="20" rx="2"/>
    <rect x="210" y="280" width="45" height="15" rx="2"/>
  </g>
  
  <!-- Footer Note -->
  <text x="150" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#6c757d" text-anchor="middle">请替换为您的真实微信收款码</text>
</svg>
